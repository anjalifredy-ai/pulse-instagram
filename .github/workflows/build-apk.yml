name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Flutter APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform (only if missing)
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.pulse.instagram --project-name pulse_instagram
            # Remove default counter test that references non-existent MyApp
            rm -f test/widget_test.dart
            mkdir -p test
            cat > test/widget_test.dart << 'EOF'
import 'package:flutter_test/flutter_test.dart';
import 'package:flutter_riverpod/flutter_riverpod.dart';
import 'package:pulse_instagram/app.dart';

void main() {
  testWidgets('App smoke test', (WidgetTester tester) async {
    await tester.pumpWidget(
      const ProviderScope(
        child: PulseInstagramApp(),
      ),
    );
    expect(find.text('Pulse'), findsOneWidget);
  });
}
EOF
          else
            echo "android/ folder already exists, skipping create"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (non-fatal)
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-instagram-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
