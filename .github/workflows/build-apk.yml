name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Flutter APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Backup google-services.json
        run: |
          mkdir -p /tmp/firebase
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/firebase/google-services.json
          fi

      - name: Generate clean Android platform
        run: |
          rm -rf android ios web linux macos windows
          flutter create . --platforms=android --org com.pulse.instagram --project-name pulse_instagram
          rm -f test/widget_test.dart

      - name: Restore google-services.json
        run: |
          mkdir -p android/app
          if [ -f /tmp/firebase/google-services.json ]; then
            cp /tmp/firebase/google-services.json android/app/google-services.json
          fi
          # minSdk for webrtc
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-instagram-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
