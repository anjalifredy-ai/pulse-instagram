name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Flutter APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Backup google-services.json
        run: |
          mkdir -p /tmp/firebase
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/firebase/google-services.json
          fi

      - name: Generate clean Android platform
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.pulse.instagram --project-name pulse_instagram
          rm -f test/widget_test.dart

      - name: Restore google-services.json + apply Google Services plugin
        run: |
          mkdir -p android/app
          if [ -f /tmp/firebase/google-services.json ]; then
            cp /tmp/firebase/google-services.json android/app/google-services.json
            echo "google-services.json restored"
          fi

          # Apply Google Services plugin in settings.gradle / build.gradle
          # settings.gradle (new style)
          if grep -q "plugins" android/settings.gradle; then
            if ! grep -q "com.google.gms.google-services" android/settings.gradle; then
              sed -i "/id \"dev.flutter.flutter-plugin-loader\"/a\    id \"com.google.gms.google-services\" version \"4.4.2\" apply false" android/settings.gradle || true
            fi
          fi

          # app/build.gradle
          if [ -f android/app/build.gradle ]; then
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              echo '' >> android/app/build.gradle
              echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle
            fi
          fi

          # Also handle build.gradle.kts if present
          if [ -f android/app/build.gradle.kts ]; then
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle.kts; then
              echo '' >> android/app/build.gradle.kts
              echo 'apply(plugin = "com.google.gms.google-services")' >> android/app/build.gradle.kts
            fi
          fi

          # Min SDK for WebRTC / permissions
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = .*/minSdk = 24/' android/app/build.gradle || true
            sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 24/' android/app/build.gradle.kts || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (non-fatal)
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-instagram-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
